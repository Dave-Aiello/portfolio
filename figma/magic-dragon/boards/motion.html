<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Magic Dragon motion</title>
<!-- Motion specs for the Figma file. Poster frames are built from the real launch screen
     and the finished splash line art (assets/brand/dragon-line.json: 14 strokes in drawing
     order, each with its start and duration within a pass). Every poster is vector: each
     stroke is cut at the exact point the pen has reached. Timings follow the splash
     reference build (splash-draw/index.html) and live in T below. -->
<link rel="stylesheet" href="../../../prototype/magic-dragon/src/shared/base.css">
<link rel="stylesheet" href="../../../prototype/magic-dragon/src/gallery/styles.css">
<link rel="stylesheet" href="components-extra.css">
<style>
html,body{width:3800px;height:2300px;overflow:hidden;background:#F7F6F3}
.board-section{position:absolute;left:0}
.cap{position:absolute;width:390px}
.cap .n{font-size:20px;line-height:26px;font-weight:600;letter-spacing:-0.015em}
.cap .t-body{margin-top:4px;color:var(--ink2)}
.annotation{position:absolute;display:flex;gap:20px;width:560px}
.ann-line{width:2px;align-self:stretch;background:var(--purple);border-radius:1px;flex:none}
.ann-body{flex:1}
.ann-body .t-h2{margin-bottom:14px}
.ann-row{display:flex;gap:16px;padding:8px 0;border-top:1px solid var(--line)}
.ann-key{width:120px;flex:none;color:var(--ink2)}
.ann-val{flex:1}
.timeline{position:absolute;width:1700px}
.tl-row{position:relative;display:flex;align-items:center;height:40px}
.tl-label{width:220px;flex:none}
.tl-track{position:relative;width:1430px;height:40px;border-top:1px solid var(--line)}
.tl-bar{position:absolute;top:12px;height:16px;border-radius:4px;background:var(--purple)}
.tl-bar.soft{background:#9B7CC0}
.tl-bar.pale{background:#D9CDE9}
.tl-bar.grey{background:var(--ink3)}
.tl-axis{position:relative;margin-left:220px;width:1430px;height:24px;border-top:1px solid var(--ink3)}
.tl-tick{position:absolute;top:6px;width:80px;margin-left:-40px;text-align:center}
.poster{position:absolute;border-radius:16px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.ring6,.core6{position:absolute;border-radius:50%;background:var(--green)}
.glide-tick{position:absolute;width:80px;text-align:center}
.mark-wrap{position:relative;width:88px}
.mark-wrap svg{position:absolute;left:0;top:0}
</style>
</head>
<body>
<section class="board-section" data-name="Splash: hand-drawn dragon" style="top:0;width:3620px;height:1360px" id="s1"></section>
<section class="board-section" data-name="Pulsing open dot: 1.6 s loop" style="top:1480px;width:1480px;height:330px" id="s2"></section>
<section class="board-section" data-name="Driver marker glide: 1 s" style="top:1920px;width:1660px;height:300px" id="s3"></section>
<script src="harvest.js"></script>
<script>
/* splash timing, from the reference build (seconds) */
/* The animation ends on the mark itself: the tint fades in under the lines, which stay
   at full strength. There is no dark fill and the lines never fade out. */
const T = { draw: 1.3, redraw: 2.6, rest: 0.35, fadeBack: 0.6, ghost: 0.16, tint: 0.4, wordDelay: 0.2, word: 0.4, rise: 8, hold: 0.6, handoff: 0.45 };
const FINISH = Math.max(T.tint, T.wordDelay + T.word) + T.hold;   /* 1.2 s: 1.3 to 2.5 s on a fast load */
const POSTERS = [[0, "Blank canvas"], [400, "Head and back wing"], [800, "Wings, tail and body"], [1180, "Everything but the eyes"], [1300, "Eyes last: all 14 strokes"], [1550, "Tint fading in under the lines, wordmark rising"], [1900, "Final frame: the mark, held to 2.5 s; also the Reduce Motion frame"]];
const clamp = (v) => Math.max(0, Math.min(1, v));
const ease = (x) => (1 - Math.cos(Math.PI * clamp(x))) / 2;              /* tint, fade-back, cross-fades */
const out3 = (x) => 1 - Math.pow(1 - clamp(x), 3);                         /* wordmark */
const pen = (x) => { x = clamp(x); return 0.25 * x + 0.75 * (1 - Math.cos(Math.PI * x)) / 2; };
const inOutCubic = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const outQuad = (p) => 1 - (1 - p) * (1 - p);
const el = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
const r2 = (n) => Math.round(n * 100) / 100;

/* fast load (the menu is ready within the first pass) */
function fastState(t) {
  const s = t / 1000;
  if (s < T.draw) return { u: s / T.draw, ink: 1, ghost: 0, tint: 0, word: 0 };
  const k = Math.min(s - T.draw, FINISH);
  return { u: 1, ink: 1, ghost: 0, tint: ease(k / T.tint), word: out3((k - T.wordDelay) / T.word) };
}

/* ---- the finished line art: absolute M/C/Z paths, cut exactly with de Casteljau */
function parseStroke(s) {
  const nums = s.d.match(/[MCZ]|-?\d*\.?\d+(?:e-?\d+)?/gi);
  let i = 0, cur = null, start = null;
  const segs = [];
  while (i < nums.length) {
    const c = nums[i++];
    if (c === "M") { cur = [+nums[i++], +nums[i++]]; start = cur; }
    else if (c === "C") {
      while (i < nums.length && !/[MCZ]/i.test(nums[i])) {
        const p = [cur, [+nums[i], +nums[i + 1]], [+nums[i + 2], +nums[i + 3]], [+nums[i + 4], +nums[i + 5]]];
        i += 6; segs.push(p); cur = p[3];
      }
    } else if (/Z/i.test(c)) { segs.push([cur, cur, start, start]); cur = start; }
  }
  const at = (p, t) => { const m = 1 - t; return [m * m * m * p[0][0] + 3 * m * m * t * p[1][0] + 3 * m * t * t * p[2][0] + t * t * t * p[3][0], m * m * m * p[0][1] + 3 * m * m * t * p[1][1] + 3 * m * t * t * p[2][1] + t * t * t * p[3][1]]; };
  const tables = segs.map((p) => { const tab = [0]; let prev = p[0], L = 0; for (let k = 1; k <= 32; k++) { const q = at(p, k / 32); L += Math.hypot(q[0] - prev[0], q[1] - prev[1]); tab.push(L); prev = q; } return tab; });
  const len = tables.reduce((n, t) => n + t[32], 0);
  return { id: s.id, start: s.start, dur: s.dur, segs, tables, len, d: s.d };
}
function split(p, t) {
  const lerp = (a, b) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
  const a = lerp(p[0], p[1]), b = lerp(p[1], p[2]), c = lerp(p[2], p[3]), d = lerp(a, b), e = lerp(b, c), f = lerp(d, e);
  return [p[0], a, d, f];
}
function cut(s, f) {
  if (f <= 0) return "";
  if (s.pts) return cutPolyline(s, f);
  if (f >= 1) return s.d;
  let left = s.len * f, out = "M" + r2(s.segs[0][0][0]) + " " + r2(s.segs[0][0][1]);
  const C = (p) => "C" + [p[1], p[2], p[3]].map((q) => r2(q[0]) + " " + r2(q[1])).join(" ");
  for (let i = 0; i < s.segs.length && left > 0; i++) {
    const tab = s.tables[i], L = tab[32];
    if (L <= left) { out += C(s.segs[i]); left -= L; continue; }
    let k = 1; while (tab[k] < left) k++;
    const t = (k - 1 + (left - tab[k - 1]) / (tab[k] - tab[k - 1] || 1)) / 32;
    out += C(split(s.segs[i], t));
    left = 0;
  }
  return out;
}

/* ---- fallback when dragon-line.json is missing: trace the logo's outlines (drawn together) */
function trace(img, W) {
  const H = Math.round(W * img.naturalHeight / img.naturalWidth), cw = W + 2, ch = H + 2;
  const c = document.createElement("canvas"); c.width = cw; c.height = ch;
  const g = c.getContext("2d"); g.drawImage(img, 1, 1, W, H);
  const d = g.getImageData(0, 0, cw, ch).data;
  const lum = (i) => (0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2]) / 255;
  const hist = new Array(32).fill(0);
  for (let i = 0; i < cw * ch; i++) if (d[i * 4 + 3] > 250) hist[Math.min(31, Math.floor(lum(i) * 32))]++;
  const body = (hist.indexOf(Math.max(...hist)) + 0.5) / 32;
  const inside = new Uint8Array(cw * ch);
  for (let i = 0; i < cw * ch; i++) inside[i] = d[i * 4 + 3] > 127 && Math.abs(lum(i) - body) < 0.12 ? 1 : 0;
  const v = (x, y) => inside[y * cw + x], adj = new Map(), key = (x, y) => x * 2 + "," + y * 2;
  const link = (a, b) => { for (const [p, q] of [[a, b], [b, a]]) { if (!adj.has(p)) adj.set(p, []); adj.get(p).push(q); } };
  for (let y = 0; y < ch - 1; y++) for (let x = 0; x < cw - 1; x++) {
    const k = v(x, y) * 8 + v(x + 1, y) * 4 + v(x + 1, y + 1) * 2 + v(x, y + 1);
    if (k === 0 || k === 15) continue;
    const Tp = key(x + 0.5, y), R = key(x + 1, y + 0.5), B = key(x + 0.5, y + 1), L = key(x, y + 0.5);
    ({ 1: [[L, B]], 2: [[B, R]], 3: [[L, R]], 4: [[Tp, R]], 5: [[Tp, R], [L, B]], 6: [[Tp, B]], 7: [[Tp, L]], 8: [[Tp, L]], 9: [[Tp, B]], 10: [[Tp, L], [B, R]], 11: [[Tp, R]], 12: [[L, R]], 13: [[B, R]], 14: [[L, B]] })[k].forEach(([a, b]) => link(a, b));
  }
  const seen = new Set(), loops = [];
  for (const st of adj.keys()) {
    if (seen.has(st)) continue;
    const loop = []; let prev = null, cur = st;
    while (cur && !seen.has(cur)) { seen.add(cur); const [px, py] = cur.split(",").map(Number); loop.push([px / 2 - 1, py / 2 - 1]); const next = adj.get(cur).find((n) => n !== prev && !seen.has(n)); prev = cur; cur = next; }
    if (loop.length > 8) loops.push(loop);
  }
  const s = 176 / W;
  return loops.map((l) => { const pts = l.filter((_, i) => i % 3 === 0).map(([x, y]) => [x * s, y * s]); let len = 0; for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return { pts, len, start: 0, dur: 1, d: "M" + pts.map((p) => r2(p[0]) + " " + r2(p[1])).join("L") + "Z" }; }).filter((p) => p.len > 12);
}
function cutPolyline(s, f) {
  if (f >= 1) return s.d;
  let left = s.len * f, out = [s.pts[0]];
  for (let i = 1; i < s.pts.length && left > 0; i++) {
    const a = s.pts[i - 1], b = s.pts[i], seg = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (seg <= left) { out.push(b); left -= seg; } else { const t = left / seg; out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]); left = 0; }
  }
  return out.length > 1 ? "M" + out.map((p) => r2(p[0]) + " " + r2(p[1])).join("L") : "";
}

/* The mark at one moment, bottom to top: the tint (body, foot, belly), a ghost layer with
   all 14 strokes, and the ink layer with each stroke cut where the pen is. The SVG uses the
   mark's own viewBox, so `size` is the mark's full width, strokes included (88 pt on launch). */
function viewBoxOf(art) { return art.mark && art.mark.viewBox ? art.mark.viewBox : [-2, -2, art.width + 4, art.height + 4]; }
function markHeight(art, size) { const vb = viewBoxOf(art); return r2(size * vb[3] / vb[2]); }
function lineSvg(strokes, st, size, art, x0, y0) {
  const vb = viewBoxOf(art), sw = art.stroke;
  const colors = (art.mark && art.mark.colors) || { line: art.color, body: "#CFC0DF", belly: "#EFE8F7" };
  let paths = "";
  const tintA = r2(st.tint || 0), ghostA = r2(st.ghost || 0), inkA = r2(st.ink || 0);
  if (tintA > 0) (art.tints || []).forEach((t) => {
    const fill = /belly/.test(t.role || t.id) ? colors.belly : colors.body;
    paths += '<path d="' + t.d + '" fill="' + fill + '"' + (tintA < 1 ? ' fill-opacity="' + tintA + '"' : "") + ' stroke="none"/>';
  });
  if (ghostA > 0) strokes.forEach((s) => { paths += '<path d="' + s.d + '" fill="none" stroke="' + colors.line + '" stroke-opacity="' + ghostA + '" stroke-width="' + sw + '" stroke-linecap="round" stroke-linejoin="round"/>'; });
  if (inkA > 0) strokes.forEach((s) => {
    const f = st.u <= s.start ? 0 : pen((st.u - s.start) / s.dur);
    const d = cut(s, f);
    if (d) paths += '<path d="' + d + '" fill="none" stroke="' + colors.line + '"' + (inkA < 1 ? ' stroke-opacity="' + inkA + '"' : "") + ' stroke-width="' + sw + '" stroke-linecap="round" stroke-linejoin="round"/>';
  });
  return paths ? '<svg aria-label="Mark" style="position:absolute;left:' + r2(x0 || 0) + "px;top:" + r2(y0 || 0) + 'px" width="' + size + '" height="' + markHeight(art, size) + '" viewBox="' + vb.join(" ") + '">' + paths + "</svg>" : "";
}

function annotation(title, rows, style) {
  return el('<div class="annotation" data-name="Spec: ' + title + '" style="' + style + '"><div class="ann-line"></div><div class="ann-body"><div class="t-h2">' + title + "</div>" +
    rows.map(([k, v]) => '<div class="ann-row t-body"><span class="ann-key">' + k + '</span><span class="ann-val">' + v + "</span></div>").join("") + "</div></div>");
}

(async function () {
  const h = await window.harvest();
  const launch = h.find(".launch-mark");
  const sb = h.find(".sb"), hi = h.find(".hi");
  const marker = h.asset("brand/driver-marker-26pt@8x.png");

  /* the finished line art, or a traced fallback */
  let art = await fetch(h.asset("brand/dragon-line.json")).then((r) => (r.ok ? r.json() : null)).catch(() => null);
  let strokes;
  if (art && art.strokes) strokes = art.strokes.map(parseStroke);
  else {
    const img = new Image(); img.src = h.asset("brand/dragon-no-smoke-flat.png"); await img.decode();
    art = { width: 176, height: r2(176 * img.naturalHeight / img.naturalWidth), stroke: 3.5, color: "#4b0d83" };
    strokes = trace(img, 520);
  }
  const eyes = strokes.filter((s) => /eye/.test(s.id || ""));
  const eyesAt = eyes.length ? Math.min(...eyes.map((s) => s.start)) * T.draw : 1.18;

  /* 1. splash posters, fast load */
  const s1 = document.getElementById("s1");
  POSTERS.forEach(([t, label], i) => {
    const x = i * 430;
    const st = fastState(t);
    const scr = el('<div class="screen" data-frame data-name="Splash ' + t + ' ms" style="position:absolute;left:' + x + 'px;top:0"></div>');
    scr.appendChild(h.copy(sb));
    const m = h.copy(launch);
    /* the launch mark image is replaced by the animated mark at the same size and place */
    const img = m.querySelector("img");
    const wrap = el('<div class="mark-wrap" style="height:' + markHeight(art, 88) + 'px"></div>');
    img.replaceWith(wrap);
    wrap.insertAdjacentHTML("beforeend", lineSvg(strokes, st, 88, art));
    const wm = m.querySelector(".wm");
    if (wm) { wm.style.opacity = String(r2(st.word)); wm.style.transform = "translateY(" + (T.rise * (1 - st.word)).toFixed(2) + "px)"; }
    scr.appendChild(m);
    scr.appendChild(h.copy(hi));
    s1.appendChild(scr);
    s1.appendChild(el('<div class="cap" style="left:' + x + 'px;top:872px"><div class="n">' + t + ' ms</div><div class="t-body">' + label + "</div></div>"));
  });
  s1.appendChild(annotation("Splash: hand-drawn dragon", [
    ["Line", "14 strokes in drawing order, head first, eyes last (" + eyesAt.toFixed(2) + " to 1.3 s); 0 to 1.3 s"],
    ["Pen", "Each stroke eases in and out, with slight overlaps after a pen lift. 3.5 per 176 of dragon (about 1.75 pt at the 88 pt mark), round caps"],
    ["Tint", "The lavender body and foot (#CFC0DF) and faint belly (#EFE8F7) fade in under the lines, 1.3 to 1.7 s, and stay"],
    ["End state", "The lines stay at full strength and there is no dark fill: the last frame is the mark itself"],
    ["Wordmark", "Fades in and rises 8 pt, 1.5 to 1.9 s; the screen holds until 2.5 s"],
    ["Fast load", "Cross-fades into Home, 2.5 to 2.95 s"],
    ["Slow load", "Lines rest 0.35 s, fade to a 16% ghost over 0.6 s and redraw over 2.6 s, looping until the menu arrives, then finish from the pen's position and end on the same tinted mark"],
    ["Reduce Motion", "Shows the final frame, then the same cross-fade into Home"]
  ], "left:3060px;top:0"));

  const tl = el('<div class="timeline" data-name="Timeline, fast load" style="left:0;top:990px"><div class="t-h2" style="margin-bottom:14px">Timeline, fast load</div></div>');
  const span = 3000, tw = 1430;
  /* each row: label, then bars [start, end, style]; the tint fades in, then stays */
  const rows = [["Line draws", [[0, 1300, ""]]], ["Eyes", [[Math.round(eyesAt * 1000), 1300, ""]]], ["Tint fades in, then stays", [[1300, 1700, "soft"], [1700, 2950, "pale"]]],
    ["Lines", [[0, 2950, "pale"]]], ["Wordmark rises 8 pt", [[1500, 1900, "soft"]]], ["Hold", [[1900, 2500, "pale"]]], ["Cross-fade to Home", [[2500, 2950, "grey"]]]];
  for (const [label, bars] of rows) {
    tl.appendChild(el('<div class="tl-row"><div class="tl-label t-body">' + label + '</div><div class="tl-track">' +
      bars.map(([a, b, cls]) => '<div class="tl-bar ' + cls + '" style="left:' + (a / span * tw).toFixed(1) + "px;width:" + ((b - a) / span * tw).toFixed(1) + 'px"></div>').join("") + "</div></div>"));
  }
  const axis = el('<div class="tl-axis"></div>');
  for (let t = 0; t <= span; t += 500) axis.appendChild(el('<div class="tl-tick t-sub" style="left:' + (t / span * tw).toFixed(1) + 'px">' + (t / 1000).toFixed(1) + " s</div>"));
  tl.appendChild(axis);
  s1.appendChild(tl);

  /* slow load, at 2x: rest, ghost, redraw over the ghost, the menu arrives */
  s1.appendChild(el('<div class="t-h2" style="position:absolute;left:1800px;top:990px">Slow load, up close</div>'));
  const slow = [
    [{ u: 1, ink: 1, ghost: 0, tint: 0 }, "Drawn, resting 0.35 s"],
    [{ u: 0, ink: 0, ghost: T.ghost, tint: 0 }, "Faded to a 16% ghost, 0.6 s"],
    [{ u: 0.45, ink: 1, ghost: T.ghost, tint: 0 }, "Redrawing over the ghost, 2.6 s a pass"],
    [{ u: 0.8, ink: 1, ghost: T.ghost, tint: 0 }, "Menu arrives: the pen speeds up and finishes"],
    [{ u: 1, ink: 1, ghost: 0, tint: 1 }, "Then the same tinted mark as a fast load"]
  ];
  slow.forEach(([st, label], i) => {
    const x = 1800 + i * 236, size = 180, top = r2((216 - markHeight(art, size)) / 2);
    const tile = el('<div class="poster" data-frame data-name="Slow load ' + (i + 1) + '" style="left:' + x + 'px;top:1030px;width:216px;height:216px;background:#F7F6F3"></div>');
    const svg = lineSvg(strokes, st, size, art, 18, top);
    if (svg) tile.insertAdjacentHTML("beforeend", svg);
    s1.appendChild(tile);
    s1.appendChild(el('<div class="cap t-sub" style="left:' + x + 'px;top:1256px;width:216px">' + label + "</div>"));
  });

  /* 2. pulsing open dot, drawn at 6x */
  const s2 = document.getElementById("s2");
  [0, 400, 800, 1200].forEach((t, i) => {
    const e = outQuad(t / 1600), scale = 1 + 1.4 * e, op = 0.45 * (1 - e);
    const size = 60 * scale, off = (175 - size) / 2;
    const p = el('<div class="poster" data-frame data-name="Open dot ' + t + ' ms" style="left:' + i * 195 + 'px;top:0;width:175px;height:175px">' +
      '<div class="ring6" style="left:' + off.toFixed(2) + "px;top:" + off.toFixed(2) + "px;width:" + size.toFixed(2) + "px;height:" + size.toFixed(2) + "px;opacity:" + op.toFixed(3) + '"></div>' +
      '<div class="core6" style="left:57.5px;top:57.5px;width:60px;height:60px"></div></div>');
    s2.appendChild(p);
    s2.appendChild(el('<div class="cap t-sub" style="left:' + i * 195 + 'px;top:190px;width:175px">' + t + " ms</div>"));
  });
  s2.appendChild(annotation("Pulsing open dot (drawn at 6x)", [
    ["Dot", "10 pt, Status/Success; 8 pt next to Live"],
    ["Ring", "Grows 1x to 2.4x while fading 45% to 0"],
    ["Timing", "1.6 s, ease-out, restarts each loop"],
    ["Reduce Motion", "Ring hidden, the solid dot stays"]
  ], "left:860px;top:0"));

  /* 3. driver marker glide */
  const s3 = document.getElementById("s3");
  const map = el('<div class="poster" data-frame data-name="Marker glide" style="left:0;top:0;width:760px;height:240px;background:#E9E6E0;border-color:#E9E6E0"></div>');
  let streets = "";
  for (let x = -20; x < 800; x += 64) streets += "M" + x + " -10V250";
  for (let y = 20; y < 260; y += 56) streets += "M-10 " + y + "H780";
  map.innerHTML = '<svg class="map" width="760" height="240" viewBox="0 0 760 240"><rect width="760" height="240" fill="#E9E6E0"/><path d="M300 76H420V132H300z" fill="#DAE4D1"/><path d="' + streets + '" stroke="#FFFFFF" stroke-width="6" fill="none"/><path d="M-10 132H780" stroke="#DEDAD3" stroke-width="13" fill="none"/><path d="M-10 132H780" stroke="#FFFFFF" stroke-width="10" fill="none"/></svg>';
  const x0 = 80, x1 = 626;
  [[0, 0.3], [250, 0.3], [500, 0.3], [750, 0.3], [1000, 1]].forEach(([t, op]) => {
    const x = x0 + (x1 - x0) * inOutCubic(t / 1000);
    map.appendChild(el('<div class="driver-badge live" style="position:absolute;left:' + x.toFixed(2) + 'px;top:108px;opacity:' + op + '"><img src="' + marker + '" alt=""></div>'));
  });
  [[0, "0 ms"], [500, "500 ms"], [1000, "1000 ms"]].forEach(([t, l]) => {
    const x = x0 + (x1 - x0) * inOutCubic(t / 1000) + 24 - 40;
    map.appendChild(el('<div class="glide-tick t-sub" style="left:' + x.toFixed(1) + 'px;top:172px">' + l + "</div>"));
  });
  s3.appendChild(map);
  s3.appendChild(el('<div class="cap t-sub" style="left:0;top:256px;width:760px">Ghosts every 250 ms: slow start, fast middle, slow arrival</div>'));
  let curve = "M20 162";
  for (let i = 1; i <= 40; i++) { const p = i / 40; curve += "L" + (20 + 142 * p).toFixed(1) + " " + (162 - 142 * inOutCubic(p)).toFixed(1); }
  const easeTile = el('<div class="poster" data-frame data-name="Ease-in-out cubic" style="left:800px;top:0;width:182px;height:182px"><svg aria-label="Easing curve" width="182" height="182" viewBox="0 0 182 182"><path d="M20 20V162H162" stroke="#E7E4DF" stroke-width="1.5" fill="none"/><path d="' + curve + '" stroke="#4B0D83" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg></div>');
  s3.appendChild(easeTile);
  s3.appendChild(el('<div class="cap t-sub" style="left:800px;top:198px;width:182px">Ease-in-out cubic</div>'));
  s3.appendChild(annotation("Driver marker glide", [
    ["Move", "Straight line to each new GPS fix"],
    ["Timing", "1 s, ease-in-out cubic; the camera follows in step"],
    ["First fix", "Placed without animation"],
    ["Old fix", "Badge fades to 50% (Driver badge, Faded)"],
    ["Reduce Motion", "The marker jumps to the new fix"]
  ], "left:1060px;top:0"));

  await h.settle();
  window.__ready = true;
})();
