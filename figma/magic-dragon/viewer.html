<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magic Dragon prototype</title>
<meta name="description" content="Clickable prototype of the Magic Dragon iPhone app, Gallery direction.">
<!-- Simple viewer written by figma/magic-dragon/sync.js while there is no full prototype.
     ?frame=<id> opens one screen, ?bare shows only the 390 x 844 screen. -->
<style>
@font-face{font-family:Geist;src:url(assets/fonts/Geist_400Regular.ttf);font-weight:400}
@font-face{font-family:Geist;src:url(assets/fonts/Geist_600SemiBold.ttf);font-weight:600}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Geist,-apple-system,sans-serif;background:#2a282d;color:#d9d5dd;-webkit-font-smoothing:antialiased}
.stage{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:32px;padding:32px 24px}
.notes{justify-self:end;max-width:280px;font-size:14px;line-height:1.5}
.notes h1{margin:0 0 8px;font-size:18px;font-weight:600;color:#fff}
.notes p{margin:0}
.device{width:390px;height:844px;border-radius:48px;overflow:hidden;box-shadow:0 0 0 10px #111013,0 24px 60px rgba(0,0,0,.45);background:#F7F6F3}
.device iframe{display:block;width:390px;height:844px;border:0}
.map{justify-self:start;font-size:13px;line-height:1.9}
.map ol{margin:0;padding-left:18px}
.map button{all:unset;cursor:pointer}
.map button[aria-current]{color:#fff;font-weight:600}
body.bare{background:#F7F6F3}
body.bare .stage{display:block;padding:0}
body.bare .notes,body.bare .map{display:none}
body.bare .device{border-radius:0;box-shadow:none}
@media (max-width:860px){.stage{display:block;padding:0}.notes,.map{display:none}.device{border-radius:0;box-shadow:none;margin:0 auto}}
</style>
</head>
<body>
<div class="stage">
  <aside class="notes"><h1>Magic Dragon</h1><p id="note">Tap through the app. Arrow keys move between screens.</p></aside>
  <div class="device"><iframe id="screen" title="App screen"></iframe></div>
  <nav class="map" aria-label="Screens"><ol id="map"></ol></nav>
</div>
<script>
(async function () {
  const params = new URLSearchParams(location.search);
  if (params.has("bare")) document.body.classList.add("bare");
  const screens = await fetch("screens.json").then((r) => r.json());
  const frame = document.getElementById("screen");
  const map = document.getElementById("map");
  let current = 0;
  const find = (id) => {
    const k = String(id || "").toLowerCase();
    return screens.findIndex((s) => s.id === k || s.file.endsWith("/" + k + ".html") || s.file.replace(/^.*\/\d+[-_]?/, "").replace(".html", "") === k);
  };
  function show(i, push) {
    if (i < 0 || i >= screens.length) return;
    current = i;
    frame.src = screens[i].file;
    [...map.querySelectorAll("button")].forEach((b, j) => b.toggleAttribute("aria-current", j === i));
    if (push) history.replaceState(null, "", "?frame=" + screens[i].id + (params.has("bare") ? "&bare" : ""));
  }
  screens.forEach((s, i) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.textContent = s.title;
    b.onclick = () => show(i, true);
    li.appendChild(b);
    map.appendChild(li);
  });
  frame.addEventListener("load", () => {
    const doc = frame.contentDocument;
    if (!doc) return;
    doc.addEventListener("click", (e) => {
      const el = e.target.closest("[data-go]");
      if (!el) return;
      const go = el.getAttribute("data-go");
      if (go === "back") history.back(); else show(find(go), true);
    });
    const root = doc.querySelector(".screen[data-go]");
    if (root) setTimeout(() => show(find(root.getAttribute("data-go")), true), 1800);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") show(current + 1, true);
    if (e.key === "ArrowLeft") show(current - 1, true);
  });
  const start = find(params.get("frame"));
  show(start > -1 ? start : 0, false);
})();
</script>
</body>
</html>
