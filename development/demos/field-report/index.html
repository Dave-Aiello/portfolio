<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Field Reports · David Aiello</title>
  <meta name="description" content="An offline-first inspection report app built with Bootstrap 5, jQuery and HTML5 APIs.">
  <meta name="theme-color" content="#0f4f48">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../../vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <a class="visually-hidden-focusable skip" href="#main">Skip to content</a>

  <header class="appbar">
    <div class="container appbar-inner">
      <a class="appbar-title" href="./">Field Reports</a>
      <span class="net-status" id="net-status" hidden>Offline · saving on this device</span>
      <a class="appbar-link" href="/development/field-reports/">How it works</a>
    </div>
  </header>

  <main id="main" class="container py-4" tabindex="-1">
    <div id="view" aria-live="polite" aria-busy="true"></div>
  </main>

  <!-- List of saved reports -->
  <template id="tpl-list">
    <div class="d-flex align-items-center justify-content-between mb-3">
      <h1 class="h4 mb-0">Reports</h1>
      <button type="button" class="btn btn-primary" data-action="new">New report</button>
    </div>
    <div class="list-group" data-slot="items"></div>
    <p class="text-body-secondary mt-3" data-slot="empty" hidden>No reports yet.</p>
  </template>

  <!-- Report form -->
  <template id="tpl-form">
    <div class="d-flex align-items-baseline justify-content-between gap-3 mb-3">
      <h1 class="h4 mb-0">Inspection report</h1>
      <span class="save-status text-body-secondary small" data-slot="saved" role="status"></span>
    </div>

    <div class="alert alert-danger error-summary" data-slot="errors" role="alert" tabindex="-1" hidden>
      <h2 class="h6">Fix these to finish the report</h2>
      <ul class="mb-0"></ul>
    </div>

    <form novalidate data-slot="form">
      <fieldset class="section">
        <legend class="h6">Site</legend>
        <div class="mb-3">
          <label class="form-label" for="f-address">Address</label>
          <input class="form-control" id="f-address" name="address" autocomplete="street-address" required>
          <div class="invalid-feedback" id="f-address-error"></div>
        </div>
        <div class="row g-3">
          <div class="col-sm-6">
            <label class="form-label" for="f-type">Inspection type</label>
            <select class="form-select" id="f-type" name="type" required>
              <option value="">Choose one</option>
              <option>Sidewalk</option>
              <option>Streetlight</option>
              <option>Signage</option>
              <option>Drainage</option>
              <option>Other</option>
            </select>
            <div class="invalid-feedback" id="f-type-error"></div>
          </div>
          <div class="col-sm-6">
            <label class="form-label" for="f-when">Date and time</label>
            <input class="form-control" id="f-when" name="inspectedAt" type="datetime-local" required>
            <div class="invalid-feedback" id="f-when-error"></div>
          </div>
        </div>
        <div class="mt-3">
          <label class="form-label" for="f-inspector">Inspector</label>
          <input class="form-control" id="f-inspector" name="inspector" autocomplete="name" required>
          <div class="invalid-feedback" id="f-inspector-error"></div>
        </div>
      </fieldset>

      <fieldset class="section">
        <legend class="h6">Location</legend>
        <div class="d-flex flex-wrap align-items-center gap-3">
          <button type="button" class="btn btn-outline-secondary" data-action="locate">Use my location</button>
          <p class="mb-0 small" data-slot="location" aria-live="polite"></p>
        </div>
      </fieldset>

      <fieldset class="section">
        <legend class="h6">Findings</legend>
        <div class="mb-3" role="radiogroup" aria-labelledby="f-condition-label" aria-describedby="f-condition-error">
          <p class="form-label mb-2" id="f-condition-label">Condition</p>
          <div class="condition-options">
            <input class="btn-check" type="radio" name="condition" id="f-c-good" value="Good">
            <label class="btn btn-outline-secondary" for="f-c-good">Good</label>
            <input class="btn-check" type="radio" name="condition" id="f-c-fair" value="Fair">
            <label class="btn btn-outline-secondary" for="f-c-fair">Fair</label>
            <input class="btn-check" type="radio" name="condition" id="f-c-poor" value="Poor">
            <label class="btn btn-outline-secondary" for="f-c-poor">Poor</label>
            <input class="btn-check" type="radio" name="condition" id="f-c-hazard" value="Hazard">
            <label class="btn btn-outline-secondary" for="f-c-hazard">Hazard</label>
          </div>
          <div class="invalid-feedback d-block" id="f-condition-error"></div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="f-notes">Notes</label>
          <textarea class="form-control" id="f-notes" name="notes" rows="4" maxlength="1000" aria-describedby="f-notes-count"></textarea>
          <div class="form-text" id="f-notes-count" data-slot="count">0 / 1000</div>
        </div>
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="f-followup" name="followUp" aria-controls="f-priority-wrap" aria-expanded="false">
          <label class="form-check-label" for="f-followup">Needs follow-up</label>
        </div>
        <div class="followup" id="f-priority-wrap" hidden>
          <label class="form-label" for="f-priority">Priority</label>
          <select class="form-select" id="f-priority" name="priority">
            <option value="">Choose one</option>
            <option>Within 24 hours</option>
            <option>Within a week</option>
            <option>Next scheduled visit</option>
          </select>
          <div class="invalid-feedback" id="f-priority-error"></div>
        </div>
      </fieldset>

      <fieldset class="section">
        <legend class="h6">Photos</legend>
        <div class="dropzone" data-slot="dropzone">
          <input class="visually-hidden" type="file" id="f-photos" accept="image/*" capture="environment" multiple>
          <label class="btn btn-outline-secondary mb-0" for="f-photos">Add photos</label>
          <span class="text-body-secondary small d-none d-md-inline">or drop them here</span>
        </div>
        <div class="invalid-feedback d-block" id="f-photos-error"></div>
        <ul class="photos" data-slot="photos"></ul>
        <p class="small text-body-secondary mb-0" data-slot="photo-note" aria-live="polite"></p>
      </fieldset>

      <fieldset class="section" aria-describedby="f-signature-error">
        <legend class="h6">Signature</legend>
        <div class="sigpad">
          <canvas data-slot="signature" aria-label="Signature pad. Sign with a mouse, finger or stylus, or type your name below."></canvas>
          <button type="button" class="btn btn-sm btn-link sigpad-clear" data-action="clear-signature">Clear</button>
        </div>
        <label class="form-label mt-3" for="f-typed">Or type your full name to sign</label>
        <input class="form-control" id="f-typed" name="typedSignature" autocomplete="name">
        <div class="invalid-feedback d-block" id="f-signature-error"></div>
      </fieldset>

      <div class="d-flex flex-wrap gap-2 mt-4">
        <button type="submit" class="btn btn-primary">Finish report</button>
        <a class="btn btn-outline-secondary" href="./">Save draft</a>
        <button type="button" class="btn btn-link text-danger ms-auto" data-action="delete">Delete</button>
      </div>
    </form>
  </template>

  <!-- Finished report -->
  <template id="tpl-summary">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3 no-print">
      <a href="./" class="link-secondary">All reports</a>
      <div class="d-flex flex-wrap gap-2">
        <button type="button" class="btn btn-outline-secondary" data-action="edit">Edit</button>
        <button type="button" class="btn btn-outline-secondary" data-action="download">Download JSON</button>
        <button type="button" class="btn btn-outline-secondary" data-action="share" hidden>Share</button>
        <button type="button" class="btn btn-primary" data-action="print">Print or save PDF</button>
      </div>
    </div>
    <article class="report">
      <h1 class="h4" data-slot="title"></h1>
      <dl class="report-fields" data-slot="fields"></dl>
      <h2 class="h6 mt-4">Photos</h2>
      <div class="report-photos" data-slot="photos"></div>
      <h2 class="h6 mt-4">Signed</h2>
      <div data-slot="signature"></div>
    </article>
  </template>

  <div class="modal" id="delete-modal" tabindex="-1" aria-labelledby="delete-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="delete-title">Delete this report?</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">It will be removed from this device, including its photos.</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="delete-confirm">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../../vendor/jquery/jquery-3.7.1.min.js"></script>
  <script src="../../vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/store.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/signature.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
